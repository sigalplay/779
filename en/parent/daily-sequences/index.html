  <style>
    :root{--cream:#fbf7f0;--ink:#40362f;--pink:#f7e4ea;--sage:#dcefe4;--sky:#e8f2f6;--line:#e4d9cf}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Rubik,Arial,sans-serif}button,a{font:inherit}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:.65rem max(1rem,calc((100% - 1120px)/2));border-bottom:1px solid var(--line);background:rgba(251,247,240,.96)}
    header img{width:82px;height:58px;object-fit:contain}header a{padding:.65rem 1rem;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-weight:700;text-decoration:none}
    main{width:min(1120px,calc(100% - 2rem));margin:auto;padding:2rem 0 6rem}h1{margin:.15rem 0;font-size:clamp(2rem,5vw,3rem)}.intro{margin:.5rem 0 1.5rem;color:#756b63;line-height:1.7}
    .sequence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.sequence-card{overflow:hidden;padding:0;border:1px solid var(--line);border-radius:24px;background:#fff;color:inherit;text-align:left;box-shadow:0 4px 14px #5c49340d;cursor:pointer}.sequence-card:hover{transform:translateY(-2px)}
    .sequence-card img{display:block;width:100%;height:235px;padding:1rem;background:#fff;object-fit:contain}.caption{padding:1rem 1.2rem;border-top:1px solid #efd8df;background:var(--pink)}.caption strong{display:block;font-size:1.18rem}.caption span{display:block;margin-top:.25rem;color:#786d66;font-size:.9rem}
    .detail{display:none;margin-top:1.4rem;padding:1.2rem;border:1px solid var(--line);border-radius:28px;background:#fff}.detail.open{display:block}.detail-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}.detail h2{margin:0;font-size:1.7rem}.controls{display:flex;flex-wrap:wrap;gap:.5rem}.controls button{padding:.55rem .85rem;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700;cursor:pointer}.controls button.active{background:var(--sage);border-color:#9bcdb0}
    .sequence-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-top:1rem;padding:.75rem 1rem;border:1px solid var(--line);border-radius:18px;background:#fffaf6}.selection-hint{margin:0;color:#756b63;font-size:.9rem}.layout-picker{display:flex;align-items:center;gap:.5rem}.layout-picker strong{margin-left:.25rem}.layout-picker button{padding:.55rem .85rem;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700;cursor:pointer}.layout-picker button.active{border-color:#8fc5a6;background:var(--sage)}
    .steps{display:grid;gap:.75rem;margin-top:1rem;padding:0;list-style:none}.steps.row-layout{grid-template-columns:repeat(4,minmax(0,1fr))}.steps.column-layout{grid-template-columns:minmax(0,280px);justify-content:center}.step{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--cream)}.step-toggle{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;cursor:pointer}.step-toggle:focus-visible{outline:3px solid #69a884;outline-offset:-3px}.step img{display:block;width:100%;aspect-ratio:1/1;padding:.4rem;background:#fff;object-fit:contain}.step p{margin:0;padding:.6rem;text-align:center;font-size:.9rem;font-weight:700}.number{position:absolute;top:.45rem;right:.45rem;z-index:2;display:grid;width:1.7rem;height:1.7rem;place-items:center;border-radius:50%;background:var(--sage);font-size:.85rem;font-weight:800}.remove-mark{position:absolute;top:.45rem;left:.45rem;z-index:2;display:grid;width:1.75rem;height:1.75rem;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:1.15rem;font-weight:800}.move-controls{position:absolute;z-index:3;right:50%;bottom:.35rem;display:flex;gap:.35rem;transform:translateX(50%)}.step{padding-bottom:2.55rem}.move-button{display:grid;width:1.9rem;height:1.9rem;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font-weight:800;line-height:1;cursor:pointer;box-shadow:0 2px 6px #5c49341a}.move-button:disabled{opacity:.25;cursor:default}.empty-sequence{margin-top:1rem;padding:2rem;border:2px dashed var(--line);border-radius:18px;color:#7c7169;text-align:center}
    .step-bank{margin-top:1.25rem;padding:1rem;border:1px solid var(--line);border-radius:20px;background:#f8f5f1}.step-bank h3{margin:0 0 .25rem;font-size:1rem}.step-bank>p{margin:0 0 .75rem;color:#756b63;font-size:.84rem}.bank-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.55rem}.bank-card{position:relative;overflow:hidden;padding:0;border:1px dashed #baa99b;border-radius:14px;background:#fff;color:inherit;cursor:pointer}.bank-card img{display:block;width:100%;aspect-ratio:1/1;padding:.35rem;object-fit:contain}.bank-card span{display:block;padding:.4rem;font-size:.72rem;font-weight:700}.add-mark{position:absolute;top:.3rem;left:.3rem;display:grid;width:1.55rem;height:1.55rem;place-items:center;border-radius:50%;background:var(--sage);font-size:1rem;font-weight:800}
    .close{background:var(--pink)!important}.print{background:var(--sage)!important}.footer{text-align:center;margin-top:2rem;color:#80766e;font-size:.8rem}.footer img{display:block;width:75px;margin:.7rem auto}
    @media(max-width:700px){main{width:min(100% - 1rem,1120px);padding-top:1rem}.sequence-grid{grid-template-columns:1fr 1fr;gap:.55rem}.sequence-card img{height:130px;padding:.45rem}.caption{padding:.65rem}.caption strong{font-size:.88rem}.caption span{font-size:.72rem}.detail{padding:.65rem}.sequence-tools{align-items:flex-start;padding:.7rem}.layout-picker{flex-wrap:wrap}.layout-picker strong{width:100%}.steps.row-layout{grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}.steps.column-layout{grid-template-columns:minmax(0,230px)}.step p{font-size:.8rem}.bank-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.bank-card span{font-size:.7rem}}
    @media print{@page{size:A4 portrait;margin:10mm}header,.sequence-grid,.intro,.detail-head .close,.sequence-tools,.step-bank,.remove-mark,.move-controls{display:none!important}body,main,.detail{margin:0!important;padding:0!important;background:#fff!important}.detail{display:none!important;border:0!important}.detail.open{display:block!important}.detail-head{margin-bottom:4mm}.controls{display:none}.steps{display:grid!important;width:fit-content!important;max-width:100%!important;margin:0 auto!important;gap:5mm!important;overflow:visible!important;align-items:start!important;justify-content:center!important}.steps.row-layout{grid-template-columns:repeat(4,43mm)!important}.steps.column-layout{grid-template-columns:90mm!important}.step{box-sizing:border-box!important;width:auto!important;height:auto!important;min-height:0!important;padding:0!important;align-self:start!important;break-inside:avoid;page-break-inside:avoid;border:1.5px solid #8f857d;border-radius:5mm;background:#fff}.step-toggle{height:auto!important}.steps.row-layout .step img{width:43mm!important;height:43mm!important;aspect-ratio:auto}.steps.column-layout .step-toggle{display:grid;grid-template-columns:45mm auto;align-items:center}.steps.column-layout .step img{width:45mm;height:45mm;aspect-ratio:auto}.step p{font-size:14pt;padding:3mm}.number{width:8mm;height:8mm;font-size:12pt}.footer{display:none}}

<body>
  <header><a href="/en/">Back to Home</a><img src="/boo-nesahek-logo.png" alt="Let's Play"></header>
  <main>
    <h1>ADL Visual Sequences</h1>
    <p class="intro">Choose an everyday activity. Each sequence has clear illustrated steps and is ready to print.</p>
    <div class="sequence-grid" id="sequence-grid"></div>
    <section class="detail" id="detail" aria-live="polite"></section>
    <div class="footer"><img src="/boo-nesahek-logo.png" alt="Let's Play"><span>© Let's Play</span></div>
  </main>
  <script>
    const root='/icon-bank/daily-sequences/';
    const sequences=[
      {id:'toilet',title:'Using the Toilet',description:'From entering the bathroom through washing hands',cover:'toilet/enter.webp',gender:true,steps:[['enter','Go into the bathroom'],['clothes','Pull down pants and underwear'],['sit','Sit comfortably'],['wipe','Wipe'],['flush','Flush the toilet'],['hands','Wash hands']]},
      {id:'hands',title:'Handwashing',description:'A short, clear visual sequence for the sink',cover:'hands/rub.webp',steps:[['open','Turn on the faucet'],['water','Wet your hands'],['soap','Apply soap'],['rub','Rub palms, fingers, and the backs of hands'],['rinse','Rinse off the soap'],['close','Turn off the faucet'],['dry','Dry your hands']]},
      {id:'shower',title:'Taking a Shower',description:'Getting ready, washing, drying, and dressing',cover:'shower/water.webp',gender:true,steps:[['undress','Take off your shirt'],['pants','Take off your pants'],['socks','Take off your socks'],['shoes','Take off your shoes'],['basket','Put your clothes in the hamper'],['water','Step into the shower and turn on comfortably warm water'],['soap','Wash your body with soap'],['rinse','Rinse off the soap'],['shampoo','Wash your hair with shampoo'],['shampoo-rinse','Rinse out the shampoo'],['conditioner','Apply conditioner'],['conditioner-rinse','Rinse out the conditioner'],['dry','Turn off the water and dry off'],['dress','Put on clean clothes']]},
      {id:'dressing',title:'Getting Dressed',description:'Put on clothes in order',cover:'dressing/done.webp',gender:true,steps:[['underwear','Put on underwear'],['shirt','Put on a shirt'],['pants','Put on pants'],['socks','Put on socks'],['shoes','Put on shoes'],['done','Check the mirror — all done']]}
    ];
    const grid=document.getElementById('sequence-grid'),detail=document.getElementById('detail');let active=null,gender='girl',layout='column',selectedKeys=[];
    grid.innerHTML=sequences.map(s=>`<button class="sequence-card" data-id="${s.id}"><img src="${root+s.cover}" alt="Illustration of ${s.title}"><div class="caption"><strong>${s.title}</strong><span>${s.description}</span></div></button>`).join('');
    function imageFor(s,key){const genderKeys={toilet:['enter'],shower:['undress','shampoo','shampoo-rinse','conditioner','conditioner-rinse'],dressing:['underwear','done']};return root+s.id+'/'+((s.gender&&genderKeys[s.id]?.includes(key))?gender+'/':'')+key+'.webp'}
    function selectedSteps(s){return selectedKeys.map(key=>s.steps.find(step=>step[0]===key)).filter(Boolean)}
    function setLayout(next){layout=next;document.body.classList.toggle('layout-row',layout==='row');let pageStyle=document.getElementById('sequencePageStyle');if(!pageStyle){pageStyle=document.createElement('style');pageStyle.id='sequencePageStyle';document.head.append(pageStyle)}pageStyle.textContent=layout==='row'?'@page{size:A4 landscape;margin:12mm}':'@page{size:A4 portrait;margin:12mm}';render()}
    function toggleStep(key){selectedKeys=selectedKeys.includes(key)?selectedKeys.filter(item=>item!==key):[...selectedKeys,key];render()}
    function moveStep(key,delta){const from=selectedKeys.indexOf(key),to=from+delta;if(from<0||to<0||to>=selectedKeys.length)return;[selectedKeys[from],selectedKeys[to]]=[selectedKeys[to],selectedKeys[from]];render()}
    function render(){const s=sequences.find(x=>x.id===active);if(!s)return;const visible=selectedSteps(s),bank=s.steps.filter(step=>!selectedKeys.includes(step[0]));detail.classList.add('open');detail.innerHTML=`<div class="detail-head"><h2>${s.title}</h2><div class="controls">${s.gender?`<button data-gender="girl" class="${gender==='girl'?'active':''}">Girl</button><button data-gender="boy" class="${gender==='boy'?'active':''}">Boy</button>`:''}<button class="print" data-print>Print</button><button class="close" data-close>Close</button></div></div><div class="sequence-tools"><p class="selection-hint">Tap a picture to remove it from the sequence.</p><div class="layout-picker"><strong>Sequence layout:</strong><button type="button" data-layout="column" class="${layout==='column'?'active':''}">↕ Vertical</button><button type="button" data-layout="row" class="${layout==='row'?'active':''}">↔ Horizontal</button></div></div>${visible.length?`<ol class="steps ${layout}-layout">${visible.map((x,i)=>`<li class="step"><span class="number">${i+1}</span><span class="remove-mark" aria-hidden="true">×</span><button type="button" class="step-toggle" data-toggle-step="${x[0]}" aria-label="Remove ${x[1]} from the sequence"><img src="${imageFor(s,x[0])}" alt="${x[1]}"><p>${x[1]}</p></button><div class="move-controls" aria-label="Change picture position"><button type="button" class="move-button" data-move-key="${x[0]}" data-move="-1" ${i===0?'disabled':''} aria-label="${layout==='row'?'Move right':'Move up'}">${layout==='row'?'→':'↑'}</button><button type="button" class="move-button" data-move-key="${x[0]}" data-move="1" ${i===visible.length-1?'disabled':''} aria-label="${layout==='row'?'Move left':'Move down'}">${layout==='row'?'←':'↓'}</button></div></li>`).join('')}</ol>`:`<div class="empty-sequence">Choose pictures from the library to build the sequence.</div>`}${bank.length?`<section class="step-bank"><h3>Picture Library</h3><p>Tap a picture to add it back to the sequence.</p><div class="bank-grid">${bank.map(x=>`<button type="button" class="bank-card" data-toggle-step="${x[0]}" aria-label="Add ${x[1]} to the sequence"><span class="add-mark" aria-hidden="true">+</span><img src="${imageFor(s,x[0])}" alt="${x[1]}"><span>${x[1]}</span></button>`).join('')}</div></section>`:''}`;detail.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{gender=b.dataset.gender;render()});detail.querySelectorAll('[data-toggle-step]').forEach(button=>button.onclick=()=>toggleStep(button.dataset.toggleStep));detail.querySelectorAll('[data-move-key]').forEach(button=>button.onclick=event=>{event.stopPropagation();moveStep(button.dataset.moveKey,Number(button.dataset.move))});detail.querySelectorAll('[data-layout]').forEach(button=>button.onclick=()=>setLayout(button.dataset.layout));detail.querySelector('[data-print]').onclick=()=>window.print();detail.querySelector('[data-close]').onclick=()=>{detail.classList.remove('open');active=null;scrollTo({top:0,behavior:'smooth'})};}
    grid.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;active=b.dataset.id;gender='girl';layout='column';const s=sequences.find(x=>x.id===active);selectedKeys=s.steps.map(step=>step[0]);render();detail.scrollIntoView({behavior:'smooth',block:'start'})});
  </script>
