<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>מחולל לוח התארגנות יומי — בואו נשחק</title>
  <link rel="icon" href="/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#fbf7f0;--ink:#40362f;--sage:#b7dec8;--pink:#f7e4ea;--line:#ded4ca}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Rubik,Arial,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px max(18px,4vw);border-bottom:1px solid var(--line);background:#fbf7f0ee;backdrop-filter:blur(8px)}header img{width:64px;height:54px;object-fit:contain}.back{padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:inherit;text-decoration:none;font-weight:700}main{width:min(1100px,94%);margin:24px auto 70px}h1{margin:.2rem 0;font-size:clamp(1.8rem,5vw,2.7rem)}.intro{margin:.35rem 0 1.3rem;color:#756a62}.builder{display:grid;grid-template-columns:330px 1fr;gap:22px}.panel,.board{border:1px solid var(--line);border-radius:28px;background:#fff;padding:20px;box-shadow:0 8px 24px #493b2d0d}.title-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font:inherit}.tasks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.task-choice{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:right;font:inherit;font-weight:600;cursor:pointer}.task-choice img{width:42px;height:42px;border-radius:10px;object-fit:cover}.task-choice.selected{border-color:#73b493;background:#eef8f2}.board-head{text-align:center}.board-head img{width:64px}.board-head h2{margin:5px 0 16px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:48px 76px 1fr auto;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:18px;background:#fff}.check{width:34px;height:34px;border:3px solid #5e554e;border-radius:8px;appearance:none;cursor:pointer}.check:checked{background:#a9d9bd;box-shadow:inset 0 0 0 6px #fff}.row img{width:70px;height:64px;border-radius:13px;object-fit:cover}.row strong{font-size:1.08rem}.moves{display:flex;gap:4px}.moves button{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.actions button{padding:11px 17px;border:0;border-radius:999px;background:var(--sage);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}.actions .secondary{background:var(--pink)}.empty{padding:35px;text-align:center;color:#887b71;border:2px dashed var(--line);border-radius:18px}.legal{display:none}.custom{display:flex;gap:8px;margin-top:14px}.custom input{min-width:0;flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit}.custom button{border:0;border-radius:12px;background:var(--pink);padding:10px;font-weight:700}
    @media(max-width:760px){.builder{grid-template-columns:1fr}.tasks{grid-template-columns:1fr 1fr}.row{grid-template-columns:42px 64px 1fr}.row img{width:58px;height:55px}.moves{grid-column:2/5;justify-content:flex-end}}
    @media print{@page{size:A4 portrait;margin:25.4mm 31.8mm}body{background:#fff}header,.panel,.actions{display:none!important}main{width:auto;margin:0}.builder{display:block}.board{border:0;box-shadow:none;padding:0}.board-head img{width:18mm}.row{break-inside:avoid;padding:5px 7px;border-color:#8b8179}.row img{width:18mm;height:16mm}.moves{display:none}.legal{display:block;margin-top:8mm;border-top:1px solid #ddd;padding-top:3mm;font-size:8pt;text-align:center;color:#706860}}
  </style>
</head>
<body><header><a class="back" href="/">חזרה לבית</a><img src="/boo-nesahek-logo.png" alt="בואו נשחק"></header>
<main><h1>מחולל לוח התארגנות יומי</h1><p class="intro">בחרו פעולות, סדרו אותן והכינו לוח יומי אישי עם תיבות סימון.</p>
<div class="builder"><section class="panel"><label><strong>כותרת הלוח</strong><input id="title" class="title-input" value="הלוח היומי שלי"></label><div id="choices" class="tasks"></div><div class="custom"><input id="customText" placeholder="פעולה אישית"><button id="addCustom">הוספה</button></div></section>
<section class="board"><div class="board-head"><img src="/boo-nesahek-logo.png" alt=""><h2 id="boardTitle">הלוח היומי שלי</h2></div><div id="list" class="list"></div><div class="actions"><button onclick="window.print()">הדפסה / הורדה</button><button id="clear" class="secondary">ניקוי הלוח</button></div><p class="legal">© בואו נשחק — לשימוש אישי בלבד. המידע והפעילויות אינם מהווים תחליף לייעוץ, אבחון או טיפול מקצועי.</p></section></div></main>
<script>
const base='/icon-bank/weekly-board-kids/';
const tasks=[['wake-up.webp','קימה'],['brush-teeth.webp','צחצוח שיניים'],['get-dressed.webp','לבוש'],['breakfast.webp','ארוחת בוקר'],['pack-bag.webp','ארגון התיק'],['school.webp','בית ספר'],['kindergarten.webp','גן'],['return-home.webp','חזרה הביתה'],['lunch.webp','ארוחת צהריים'],['homework.webp','שיעורי בית'],['friends.webp','משחק עם חברים'],['playground.webp','גינה'],['craft.webp','יצירה'],['reading.webp','קריאה'],['tidy-toys.webp','סידור משחקים'],['screen-time.webp','זמן מסך'],['bath.webp','מקלחת'],['pajamas.webp','לבישת פיג׳מה'],['bedtime-story.webp','סיפור לפני השינה'],['sleep.webp','שינה']];
let selected=[];const choices=document.querySelector('#choices'),list=document.querySelector('#list');
tasks.forEach(([img,label])=>{const b=document.createElement('button');b.className='task-choice';b.innerHTML=`<img src="${base+img}" alt=""><span>${label}</span>`;b.onclick=()=>{const i=selected.findIndex(x=>x.label===label);i>=0?selected.splice(i,1):selected.push({img:base+img,label});render()};choices.append(b)});
function render(){[...choices.children].forEach((b,i)=>b.classList.toggle('selected',selected.some(x=>x.label===tasks[i][1])));list.innerHTML='';if(!selected.length){list.innerHTML='<div class="empty">בחרו פעולות כדי להתחיל לבנות את הלוח</div>';return}selected.forEach((x,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<input class="check" type="checkbox" aria-label="סימון ${x.label}"><img src="${x.img}" alt=""><strong>${x.label}</strong><div class="moves"><button aria-label="העברה למעלה">↑</button><button aria-label="העברה למטה">↓</button><button aria-label="מחיקה">×</button></div>`;const bs=row.querySelectorAll('button');bs[0].onclick=()=>move(i,-1);bs[1].onclick=()=>move(i,1);bs[2].onclick=()=>{selected.splice(i,1);render()};list.append(row)})}
function move(i,d){const n=i+d;if(n<0||n>=selected.length)return;[selected[i],selected[n]]=[selected[n],selected[i]];render()}
title.oninput=e=>boardTitle.textContent=e.target.value||'הלוח היומי שלי';addCustom.onclick=()=>{const v=customText.value.trim();if(v){selected.push({img:base+'blocks.webp',label:v});customText.value='';render()}};clear.onclick=()=>{selected=[];render()};render();
</script><script defer src="/assets/english-content-v9.js"></script></body></html>
