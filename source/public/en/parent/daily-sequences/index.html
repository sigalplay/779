  <style>
    :root{--cream:#fbf7f0;--ink:#40362f;--muted:#6f645c;--pink:#f7e4ea;--sage:#dcefe4;--sage-strong:#8fc5a6;--sky:#e8f2f6;--line:#e4d9cf;--focus:#2f7a52}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Rubik,Arial,sans-serif}button,a{font:inherit}button{touch-action:manipulation}
    :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:.65rem max(1rem,calc((100% - 1120px)/2));border-bottom:1px solid var(--line);background:rgba(251,247,240,.96)}
    header img{width:82px;height:58px;object-fit:contain}header a{padding:.65rem 1rem;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-weight:700;text-decoration:none}
    main{width:min(1120px,calc(100% - 2rem));margin:auto;padding:2rem 0 6rem}h1{margin:.15rem 0;font-size:clamp(2rem,5vw,3rem)}.intro{margin:.5rem 0 1.5rem;color:var(--muted);line-height:1.7}
    .sequence-grid{display:flex;flex-direction:column;gap:1.4rem}.sequence-group h2{margin:0 0 .6rem;font-size:1.3rem}.sequence-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}.sequence-card{overflow:hidden;padding:0;border:1px solid var(--line);border-radius:20px;background:#fff;color:inherit;text-align:start;box-shadow:0 4px 14px #5c49340d;cursor:pointer;transition:transform .15s}.sequence-card:hover{transform:translateY(-2px)}.sequence-card[aria-expanded="true"]{border-color:var(--sage-strong);box-shadow:0 0 0 3px var(--sage)}
    .sequence-card img{display:block;width:100%;height:170px;padding:.65rem;background:#fff;object-fit:contain}.caption{padding:.7rem .85rem;border-top:1px solid #efd8df;background:var(--pink)}.caption strong{display:block;font-size:1.05rem}.caption span{display:block;margin-top:.2rem;color:var(--muted);font-size:.84rem}
    .detail{display:none;margin-top:1.4rem;padding:1.2rem;border:1px solid var(--line);border-radius:28px;background:#fff;scroll-margin-top:92px}.detail.open{display:block}.detail-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}.detail h2{margin:0;font-size:1.7rem}.controls{display:flex;flex-wrap:wrap;gap:.5rem}.controls button,.layout-picker button,.reset{min-height:44px;padding:.55rem .95rem;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}.controls button[aria-pressed="true"],.layout-picker button[aria-pressed="true"]{background:var(--sage);border-color:var(--sage-strong)}

    .sequence-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-top:1rem;padding:.75rem 1rem;border:1px solid var(--line);border-radius:18px;background:#fffaf6}.selection-hint{margin:0;color:var(--muted);font-size:.92rem}.layout-picker{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}.layout-picker strong{margin-inline-end:.25rem}

    .player-top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);background:#fff}.player-top h2{margin:0;font-size:1.15rem}.player-count{color:var(--muted);font-weight:700;white-space:nowrap}.player-exit{min-width:48px;min-height:48px;border:1px solid var(--line);border-radius:999px;background:var(--pink);color:var(--ink);font-size:1rem;font-weight:800;cursor:pointer}

    .player-stage.finished .cheer{font-size:clamp(4rem,14vw,7rem);line-height:1}
    .player-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;padding:0 1rem}.player-dots span{width:14px;height:14px;border-radius:50%;background:var(--line)}.player-dots span.done{background:var(--sage-strong)}.player-dots span.now{background:#3f8a62;box-shadow:0 0 0 3px var(--sage)}
    .player-nav{display:grid;grid-template-columns:1fr 2fr;gap:.75rem;padding:1rem max(1rem,calc((100% - 720px)/2)) max(1rem,env(safe-area-inset-bottom))}.player-nav button{min-height:72px;border:1px solid var(--line);border-radius:22px;background:#fff;color:var(--ink);font-size:1.3rem;font-weight:800;cursor:pointer}.player-nav .next{border:0;background:#3f8a62;color:#fff;box-shadow:0 6px 18px #3f8a6240}.player-nav button:disabled{opacity:.3;cursor:default}
    @media(prefers-reduced-motion:reduce){.sequence-card{transition:none}.sequence-card:hover{transform:none}}
    @media(max-width:700px){main{width:min(100% - 1rem,1120px);padding-top:1rem}.sequence-cards{grid-template-columns:1fr 1fr;gap:.5rem}.sequence-group h2{font-size:1.1rem}.sequence-card img{height:100px;padding:.35rem}.caption{padding:.5rem}.caption strong{font-size:.9rem}.caption span{font-size:.72rem}.detail{padding:.65rem;scroll-margin-top:84px}.detail h2{font-size:1.35rem}.sequence-tools{align-items:flex-start;padding:.7rem}.steps.row-layout{grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}.steps.column-layout{grid-template-columns:minmax(0,100%)}.steps.column-layout .step-toggle{grid-template-columns:84px minmax(0,1fr)}.steps.column-layout .step img{width:84px;height:84px}.steps.column-layout .remove-mark{inset-inline-start:calc(84px - 2.1rem)}.steps.column-layout .step p{font-size:1rem;padding:.5rem .7rem}.step p{font-size:.9rem;padding:.4rem}.bank-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.player-nav{grid-template-columns:1fr 1.6fr}.play{font-size:1.1rem}.play small{display:none}}
    @media print{@page{size:A4 portrait;margin:10mm}header,.sequence-grid,.intro,h1,.detail-head .controls,.play,.sequence-tools,.step-bank,.remove-mark,.move-controls,.player{display:none!important}body,main,.detail{margin:0!important;padding:0!important;background:#fff!important}.detail{display:none!important;border:0!important}.detail.open{display:block!important}.detail-head{margin-bottom:4mm}.steps{display:grid!important;width:fit-content!important;max-width:100%!important;margin:0 auto!important;gap:5mm!important;overflow:visible!important;align-items:start!important;justify-content:center!important}.steps.row-layout{grid-template-columns:repeat(4,43mm)!important}.steps.column-layout{grid-template-columns:120mm!important}.step{display:block!important;box-sizing:border-box!important;width:auto!important;height:auto!important;min-height:0!important;padding:0!important;align-self:start!important;break-inside:avoid;page-break-inside:avoid;border:1.5px solid #8f857d;border-radius:5mm;background:#fff}.step-toggle{height:auto!important}.steps.row-layout .step img{width:43mm!important;height:43mm!important;aspect-ratio:auto}.steps.column-layout .step-toggle{display:grid;grid-template-columns:40mm auto;align-items:center}.steps.column-layout .step img{width:40mm;height:40mm;aspect-ratio:auto}.step p{font-size:14pt;padding:3mm}.number{width:8mm;height:8mm;font-size:12pt}.footer{display:none}}

<body>
  <header><a href="/en/">Back to Home</a><img src="/boo-nesahek-logo.png" alt="Let's Play"></header>
  <main>
    <h1>ADL Visual Sequences</h1>
    <p class="intro">Choose an everyday activity. Print it, reorder the steps, or show the child one step at a time in full screen.</p>
    <div class="sequence-grid" id="sequence-grid"></div>
    <section class="detail" id="detail"></section>
    <div class="player" id="player" role="dialog" aria-modal="true"></div>
    <div class="footer"><img src="/boo-nesahek-logo.png" alt="Let's Play"><span>© Let's Play</span></div>
  </main>
  <script>
    const L={groupDaily:'Daily routines',groupDressing:'Getting dressed, step by step',girl:'Girl',boy:'Boy',print:'Print',close:'Close',play:'Show the child: one step at a time',playHint:'Full screen',hint:'Tap a picture to remove it from the sequence. The arrows change the order.',layout:'Sequence layout',column:'Vertical',row:'Horizontal',moveUp:'Move up',moveDown:'Move down',moveEarlierRow:'Move left',moveLaterRow:'Move right',removeStep:(n,t)=>`Step ${n}: ${t}. Remove from the sequence`,position:t=>`Change the position of ${t}`,empty:'Choose pictures from the library to build the sequence.',bank:'Removed steps',bankHint:'Tap a picture to add it back at the end.',reset:'Restore all steps',addStep:t=>`Add ${t} back to the sequence`,stepOf:(n,t)=>`Step ${n} of ${t}`,allDone:'All done!',exit:'Exit step-by-step mode',prev:'Back',did:'I did it!',finish:'Finished!',greatJob:'Great job! You finished every step',again:'Start over'};
    const sequences=[
      {id:'toilet',title:'Using the Toilet',description:'From entering the bathroom through washing hands',cover:'toilet/enter.webp',gender:true,steps:[['enter','Go into the bathroom'],['clothes','Pull down pants and underwear'],['sit','Sit comfortably'],['wipe','Wipe'],['flush','Flush the toilet'],['hands','Wash hands']]},
      {id:'hands',title:'Handwashing',description:'A short, clear visual sequence for the sink',cover:'hands/rub.webp',steps:[['open','Turn on the faucet'],['water','Wet your hands'],['soap','Apply soap'],['rub','Rub palms, fingers, and the backs of hands'],['rinse','Rinse off the soap'],['close','Turn off the faucet'],['dry','Dry your hands']]},
      {id:'shower',title:'Taking a Shower',description:'Getting ready, washing, drying, and dressing',cover:'shower/water.webp',gender:true,steps:[['undress','Take off your shirt'],['pants','Take off your pants'],['socks','Take off your socks'],['shoes','Take off your shoes'],['basket','Put your clothes in the hamper'],['water','Step into the shower and turn on comfortably warm water'],['soap','Wash your body with soap'],['rinse','Rinse off the soap'],['shampoo','Wash your hair with shampoo'],['shampoo-rinse','Rinse out the shampoo'],['conditioner','Apply conditioner'],['conditioner-rinse','Rinse out the conditioner'],['dry','Turn off the water and dry off'],['dress','Put on clean clothes']]},
      {id:'dressing',title:'Getting Dressed',description:'Put on clothes in order',cover:'dressing/done.webp',gender:true,steps:[['underwear','Put on underwear'],['shirt','Put on a shirt'],['pants','Put on pants'],['socks','Put on socks'],['shoes','Put on shoes'],['done','Check the mirror — all done']]},
      {id:'shirt',title:'Putting On a T-shirt',description:'Arms first, step by step',cover:'shirt/girl/09-check.webp',group:'dressing',gender:true,genderAll:true,steps:[['01-sit','Sit on the stool'],['02-lay','Lay the shirt on your lap, star side down'],['03-open','Open the bottom of the shirt'],['04-arm-1','Put one arm into a sleeve'],['05-arm-2','Put the other arm into the other sleeve'],['06-lift','Lift the shirt over your head'],['07-head','Push your head through'],['08-pull','Pull the shirt down'],['09-check','Check: the star is in front!']]},
      {id:'pants',title:'Putting On Pants',description:'Sitting down, standing only at the end',cover:'pants/10-stand-pull.webp',group:'dressing',steps:[['01-sit','Sit on the stool'],['02-lay','Lay the pants down, bow on top'],['03-hold','Hold the waistband with both hands'],['04-leg-1','Put one foot into a leg hole'],['05-foot-1','Push until your foot comes out'],['06-leg-2','Put the other foot into the other hole'],['07-foot-2','Push until your foot comes out'],['08-knees','Pull the pants up to your knees'],['10-stand-pull','Stand up and pull the pants up to your tummy'],['11-back','Pull up at the back too']]},
      {id:'socks',title:'Putting On Socks',description:'Scrunch and slide',cover:'socks/07-up.webp',group:'dressing',steps:[['01-heel','Find the blue heel'],['02-thumbs','Put both thumbs inside the sock'],['03-scrunch','Scrunch the sock down to the heel'],['04-aim','Aim: blue heel down'],['05-toes','Slide your toes in'],['06-over-heel','Pull the sock over your heel'],['07-up','Pull the sock up'],['08-check','Check: the blue heel is on your heel']]},
      {id:'shoes',title:'Putting On Shoes',description:'Velcro shoes, with a whole heart',cover:'shoes/08-both.webp',group:'dressing',steps:[['01-heart','Line up the shoes so the heart is whole'],['02-open','Open the straps all the way'],['03-tongue','Pull the tongue forward'],['04-toes','Put your toes into the shoe'],['05-push','Hold the loop and push your foot in'],['06-stomp','Stomp your heel on the floor'],['07-close','Close the strap and press hard'],['08-both','Put on the other shoe too']]},
      {id:'zipper',title:'Zipping Up',description:'Put the pin into the box',cover:'zipper/09-top.webp',group:'dressing',steps:[['01-align','Line up both sides of the coat'],['02-down','Slide the zipper all the way down'],['03-hold-box','Hold the box tight'],['04-hold-pin','With the other hand, hold the green pin'],['05-insert','Push the pin into the box'],['06-check-pin','Check: the pin is all the way in'],['07-pull','Hold the bottom and pull the ring'],['08-chest','Keep going up to your chest'],['09-top','All the way up!']]},
      {id:'buttoning',title:'Buttoning',description:'Bottom to top, step by step',cover:'buttoning/insert.webp',group:'dressing',steps:[['start-bottom','Start with the bottom button'],['hold-button','Pinch the button with your fingers'],['hold-buttonhole','With the other hand, hold the buttonhole'],['tilt','Tip the button on its side'],['insert','Push the edge of the button into the hole'],['push-thumb','Push with your thumb'],['push-pull','Pull the button through'],['flat','Straighten it: the button lies flat'],['next','Move up to the next button'],['done','Check: every button is in its hole']]},
      {id:'laces',title:'Tying Shoelaces',description:'Bunny ears, with a two-color lace',cover:'laces/10-bow.webp',group:'dressing',steps:[['01-tight','Pull both laces up tight'],['02-cross','Make an X: pink over blue'],['03-tuck','Tuck the pink lace under and through'],['04-knot','Pull both ends out to the sides'],['05-ear-1','Make a pink bunny ear'],['06-ear-2','Make a blue bunny ear with the other hand'],['07-cross-ears','Cross the ears: X'],['08-tuck-ears','Tuck the pink ear under and through'],['09-pull','Pull the ears out to the sides'],['10-bow','You made a bow!']]}
    ];
    const root='/icon-bank/daily-sequences/',rtl=document.documentElement.dir==='rtl';
    const grid=document.getElementById('sequence-grid'),detail=document.getElementById('detail'),player=document.getElementById('player');let active=null,gender='girl',layout='column',selectedKeys=[],playIndex=0,lastFocus=null,touchX=null;
    const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const card=s=>`<button type="button" class="sequence-card" data-id="${s.id}" aria-expanded="false" aria-controls="detail"><img src="${root+s.cover}" alt=""><div class="caption"><strong>${s.title}</strong><span>${s.description}</span></div></button>`;
    grid.innerHTML=[[L.groupDaily,sequences.filter(s=>!s.group)],[L.groupDressing,sequences.filter(s=>s.group==='dressing')]].filter(([,list])=>list.length).map(([title,list])=>`<section class="sequence-group"><h2>${title}</h2><div class="sequence-cards">${list.map(card).join('')}</div></section>`).join('');
    function imageFor(s,key){const genderKeys={toilet:['enter'],shower:['undress','shampoo','shampoo-rinse','conditioner','conditioner-rinse'],dressing:['underwear','done']};return root+s.id+'/'+((s.gender&&(s.genderAll||genderKeys[s.id]?.includes(key)))?gender+'/':'')+key+'.webp'}
    function selectedSteps(s){return selectedKeys.map(key=>s.steps.find(step=>step[0]===key)).filter(Boolean)}
    function setLayout(next){layout=next;let pageStyle=document.getElementById('sequencePageStyle');if(!pageStyle){pageStyle=document.createElement('style');pageStyle.id='sequencePageStyle';document.head.append(pageStyle)}pageStyle.textContent=layout==='row'?'@page{size:A4 landscape;margin:12mm}':'@page{size:A4 portrait;margin:12mm}';render()}
    function toggleStep(key,focusSelector){selectedKeys=selectedKeys.includes(key)?selectedKeys.filter(item=>item!==key):[...selectedKeys,key];render();const next=detail.querySelector(focusSelector);if(next)next.focus()}
    function moveStep(key,delta){const from=selectedKeys.indexOf(key),to=from+delta;if(from<0||to<0||to>=selectedKeys.length)return;[selectedKeys[from],selectedKeys[to]]=[selectedKeys[to],selectedKeys[from]];render();const same=detail.querySelector(`[data-move-key="${key}"][data-move="${delta}"]:not(:disabled)`)||detail.querySelector(`[data-move-key="${key}"]:not(:disabled)`);if(same)same.focus()}
    function arrows(){return layout==='row'?(rtl?['→','←']:['←','→']):['↑','↓']}
    function render(){const s=sequences.find(x=>x.id===active);if(!s)return;const visible=selectedSteps(s),bank=s.steps.filter(step=>!selectedKeys.includes(step[0])),[back,forward]=arrows(),backLabel=layout==='row'?L.moveEarlierRow:L.moveUp,forwardLabel=layout==='row'?L.moveLaterRow:L.moveDown;
      grid.querySelectorAll('[data-id]').forEach(card=>card.setAttribute('aria-expanded',String(card.dataset.id===active)));
      detail.classList.add('open');detail.setAttribute('aria-labelledby','detail-title');
      detail.innerHTML=`<div class="detail-head"><h2 id="detail-title" tabindex="-1">${s.title}</h2><div class="controls">${s.gender?`<button type="button" data-gender="girl" aria-pressed="${gender==='girl'}">${L.girl}</button><button type="button" data-gender="boy" aria-pressed="${gender==='boy'}">${L.boy}</button>`:''}<button type="button" class="print" data-print>${L.print}</button><button type="button" class="close" data-close>${L.close}</button></div></div>${visible.length?`<button type="button" class="play" data-play>▶ ${L.play}<small>${L.playHint}</small></button>`:''}<div class="sequence-tools"><p class="selection-hint">${L.hint}</p><div class="layout-picker" role="group" aria-label="${L.layout}"><strong aria-hidden="true">${L.layout}:</strong><button type="button" data-layout="column" aria-pressed="${layout==='column'}">↕ ${L.column}</button><button type="button" data-layout="row" aria-pressed="${layout==='row'}">↔ ${L.row}</button></div></div>${visible.length?`<ol class="steps ${layout}-layout">${visible.map((x,i)=>`<li class="step"><button type="button" class="step-toggle" data-toggle-step="${x[0]}" aria-label="${esc(L.removeStep(i+1,x[1]))}"><span class="number" aria-hidden="true">${i+1}</span><span class="remove-mark" aria-hidden="true">×</span><img src="${imageFor(s,x[0])}" alt=""><p>${x[1]}</p></button><div class="move-controls" role="group" aria-label="${esc(L.position(x[1]))}"><button type="button" class="move-button" data-move-key="${x[0]}" data-move="-1" ${i===0?'disabled':''} aria-label="${backLabel}">${back}</button><button type="button" class="move-button" data-move-key="${x[0]}" data-move="1" ${i===visible.length-1?'disabled':''} aria-label="${forwardLabel}">${forward}</button></div></li>`).join('')}</ol>`:`<div class="empty-sequence">${L.empty}</div>`}${bank.length?`<section class="step-bank" aria-labelledby="bank-title"><div class="step-bank-head"><div><h3 id="bank-title">${L.bank}</h3><p>${L.bankHint}</p></div><button type="button" class="reset" data-reset>↺ ${L.reset}</button></div><div class="bank-grid">${bank.map(x=>`<button type="button" class="bank-card" data-toggle-step="${x[0]}" aria-label="${esc(L.addStep(x[1]))}"><span class="add-mark" aria-hidden="true">+</span><img src="${imageFor(s,x[0])}" alt=""><span>${x[1]}</span></button>`).join('')}</div></section>`:''}`;
      detail.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{gender=b.dataset.gender;render();detail.querySelector(`[data-gender="${gender}"]`).focus()});
      detail.querySelectorAll('.step-toggle').forEach(button=>button.onclick=()=>toggleStep(button.dataset.toggleStep,'.step-toggle, .bank-card'));
      detail.querySelectorAll('.bank-card').forEach(button=>button.onclick=()=>toggleStep(button.dataset.toggleStep,'.bank-card, [data-play]'));
      detail.querySelectorAll('[data-move-key]').forEach(button=>button.onclick=event=>{event.stopPropagation();moveStep(button.dataset.moveKey,Number(button.dataset.move))});
      detail.querySelectorAll('[data-layout]').forEach(button=>button.onclick=()=>{setLayout(button.dataset.layout);detail.querySelector(`[data-layout="${layout}"]`).focus()});
      const reset=detail.querySelector('[data-reset]');if(reset)reset.onclick=()=>{selectedKeys=s.steps.map(step=>step[0]);render();detail.querySelector('[data-play]').focus()};
      const play=detail.querySelector('[data-play]');if(play)play.onclick=()=>openPlayer();
      detail.querySelector('[data-print]').onclick=()=>window.print();
      detail.querySelector('[data-close]').onclick=()=>{const card=grid.querySelector(`[data-id="${active}"]`);detail.classList.remove('open');active=null;grid.querySelectorAll('[data-id]').forEach(c=>c.setAttribute('aria-expanded','false'));scrollTo({top:0,behavior:'smooth'});if(card)card.focus({preventScroll:true})};}
    function openPlayer(){lastFocus=document.activeElement;playIndex=0;player.classList.add('open');document.body.classList.add('player-open');renderPlayer();}
    function closePlayer(){player.classList.remove('open');document.body.classList.remove('player-open');player.innerHTML='';if(lastFocus)lastFocus.focus()}
    function renderPlayer(){const s=sequences.find(x=>x.id===active);if(!s)return closePlayer();const steps=selectedSteps(s),total=steps.length,finished=playIndex>=total,step=steps[playIndex];
      player.innerHTML=`<div class="player-top"><h2 id="player-title">${s.title}</h2><span class="player-count" aria-live="polite">${finished?L.allDone:L.stepOf(playIndex+1,total)}</span><button type="button" class="player-exit" data-exit aria-label="${L.exit}">✕</button></div><div class="player-stage${finished?' finished':''}">${finished?`<div class="cheer" aria-hidden="true">🎉</div><p>${L.greatJob}</p>`:`<img src="${imageFor(s,step[0])}" alt=""><p>${step[1]}</p>`}</div><div class="player-dots" aria-hidden="true">${steps.map((_,i)=>`<span class="${i<playIndex?'done':i===playIndex?'now':''}"></span>`).join('')}</div><div class="player-nav"><button type="button" data-prev ${playIndex===0?'disabled':''}>${rtl?'→':'←'} ${L.prev}</button>${finished?`<button type="button" class="next" data-again>↺ ${L.again}</button>`:`<button type="button" class="next" data-next>✓ ${playIndex===total-1?L.finish:L.did}</button>`}</div>`;
      player.setAttribute('aria-labelledby','player-title');
      player.querySelector('[data-exit]').onclick=closePlayer;
      player.querySelector('[data-prev]').onclick=()=>step_(-1);
      const next=player.querySelector('[data-next]');if(next)next.onclick=()=>step_(1);
      const again=player.querySelector('[data-again]');if(again)again.onclick=()=>{playIndex=0;renderPlayer()};
      (player.querySelector('.next')||player.querySelector('[data-exit]')).focus();}
    function step_(delta){const total=selectedSteps(sequences.find(x=>x.id===active)).length;playIndex=Math.max(0,Math.min(total,playIndex+delta));renderPlayer()}
    player.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closePlayer();return}const forward=rtl?'ArrowLeft':'ArrowRight',backward=rtl?'ArrowRight':'ArrowLeft';if(e.key===forward){e.preventDefault();step_(1)}else if(e.key===backward){e.preventDefault();step_(-1)}else if(e.key==='Tab'){const f=[...player.querySelectorAll('button:not(:disabled)')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    player.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});
    player.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)<60)return;step_((dx<0)!==rtl?1:-1)});
    grid.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;active=b.dataset.id;gender='girl';const s=sequences.find(x=>x.id===active);selectedKeys=s.steps.map(step=>step[0]);setLayout('column');detail.scrollIntoView({behavior:'smooth',block:'start'});detail.querySelector('#detail-title').focus({preventScroll:true})});
  </script>
